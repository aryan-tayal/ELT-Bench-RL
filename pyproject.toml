[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-rl-env"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb", "dbt-duckdb", "pandas", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
tinker = ["tinker", "tinker-cookbook"]

[tool.setuptools.packages.find]
include = ["elt_rl*"]

[tool.setuptools.package-data]
"elt_rl.tasks.synthetic_shop" = ["*.json", "sources/*", "ground_truth/*", "gold/**/*", "bad/**/*"]